name: Docker CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t kedis .

      - name: Start container
        run: docker run -d --name kedis -p 127.0.0.1:7379:7379 -v kedis-data:/data kedis

      - name: Wait until healthy
        run: |
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' kedis)
            [ "$status" = "healthy" ] && exit 0
            sleep 1
          done
          echo "container never became healthy (last status: $status)"
          exit 1

      - name: Runs as the expected non-root user
        run: |
          uid=$(docker exec kedis id -u)
          echo "uid=$uid"
          [ "$uid" = "10001" ]

      - name: Commands work, including two clients at once
        run: |
          send() {
            exec 3<>/dev/tcp/127.0.0.1/7379
            printf '%s\n' "$1" >&3
            read -t 3 -r reply <&3
            exec 3>&-
            printf '%s' "${reply%$'\r'}"
          }
          expect() {
            local got
            got=$(send "$1")
            echo "$1 -> $got"
            [ "$got" = "$2" ] || { echo "expected: $2"; exit 1; }
          }

          expect "PING" "PONG"
          expect "SET city Tokyo" "OK"
          expect "GET city" "Tokyo"

          # two connections open at the same time
          exec 4<>/dev/tcp/127.0.0.1/7379
          exec 5<>/dev/tcp/127.0.0.1/7379
          printf 'SET shared 1\n' >&4; read -t 3 -r a <&4
          printf 'GET shared\n'   >&5; read -t 3 -r b <&5
          a=${a%$'\r'}; b=${b%$'\r'}
          echo "client A: $a / client B: $b"
          if [ "$a" != "OK" ] || [ "$b" != "1" ]; then
            echo "two-client check failed"; exit 1
          fi
          exec 4>&- 5>&-

      - name: Graceful stop saves data and exits with code 0
        run: |
          docker stop kedis
          code=$(docker inspect -f '{{.State.ExitCode}}' kedis)
          echo "exit code: $code"
          [ "$code" = "0" ]
          docker logs kedis > first-run.log 2>&1
          if grep -iE "denied|failed" first-run.log; then
            echo "errors found in the first run's log"; exit 1
          fi

      - name: Data survives a restart
        run: |
          docker rm kedis
          docker run -d --name kedis -p 127.0.0.1:7379:7379 -v kedis-data:/data kedis
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' kedis)
            [ "$status" = "healthy" ] && break
            sleep 1
          done
          [ "$status" = "healthy" ]

          exec 3<>/dev/tcp/127.0.0.1/7379
          printf 'GET city\n' >&3
          read -t 3 -r reply <&3
          reply=${reply%$'\r'}
          echo "GET city after restart -> $reply"
          [ "$reply" = "Tokyo" ]

          if docker logs kedis 2>&1 | grep -iE "denied|failed"; then
            echo "errors found in the second run's log"; exit 1
          fi

      - name: Show container logs on failure
        if: failure()
        run: docker logs kedis || true

      - name: Clean up
        if: always()
        run: |
          docker rm -f kedis || true
          docker volume rm kedis-data || true